name: goes-imagenes
on:
  # Lo dispara cron-job.org cada 10 min (workflow_dispatch). El schedule es solo un respaldo: Actions no lo cumple de forma confiable.
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch: {}
concurrency:
  group: goes-imagenes
  cancel-in-progress: false
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m modelo3d.goes_imagenes
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          MODELO3D_TOKEN: ${{ secrets.MODELO3D_TOKEN }}
